name: Tv Tracker desktop release
on:
  push:
    branches: [tv-tracker]
  pull_request:
    branches: [tv-tracker]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish after live acceptance and upgrade/recovery checks have passed'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: tv-tracker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.build_version.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - name: Read desktop version
        id: build_version
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Use a stable major.minor.patch desktop version.' }
          "number=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject recognizable credentials in release source
        shell: pwsh
        run: |
          python desktop/secret_scan.py
          if ($LASTEXITCODE -ne 0) { throw 'Source credential scan failed' }
      - name: Build self-contained Windows application
        shell: pwsh
        env:
          CSC_LINK: ${{ github.event_name != 'pull_request' && secrets.TV_TRACKER_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.TV_TRACKER_CSC_KEY_PASSWORD || '' }}
        run: ./desktop/build.ps1 -Python python
      - name: Run desktop and engine regression tests
        shell: pwsh
        run: |
          npm --prefix desktop test
          if ($LASTEXITCODE -ne 0) { throw 'Desktop tests failed' }
          node --test gsheet_dashboard/test_browser_options.cjs gsheet_dashboard/test_scraper.cjs gsheet_dashboard/test_capture_validation.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Extractor fixture tests failed' }
          Push-Location gsheet_dashboard/frontend
          npx playwright test --config playwright.desktop.config.js
          if ($LASTEXITCODE -ne 0) { throw 'Desktop interface tests failed' }
          Pop-Location
          $env:PYTHONPATH = "$pwd/.desktop-build/deps;$pwd/gsheet_dashboard"
          python -m unittest discover -s gsheet_dashboard -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Engine tests failed' }
      - name: Enforce lint and dependency security gates
        shell: pwsh
        run: ./desktop/quality-gates.ps1 -Python python
      - name: Enforce representative performance budgets
        shell: pwsh
        run: |
          python desktop/benchmark_workspace.py --output .desktop-build/performance.json
          if ($LASTEXITCODE -ne 0) { throw 'Performance budget failed' }
      - name: Verify packaged lifecycle and connection recovery
        timeout-minutes: 5
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $env:DESKTOP_EXE = "$pwd/release/$version/win-unpacked/Tv Tracker.exe"
          node desktop/smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaged lifecycle tests failed' }
          node desktop/report-smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaged report tests failed' }
          node desktop/recovery-smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaged connection recovery tests failed' }
          node desktop/shutdown-smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaged unresponsive-engine shutdown tests failed' }
      - name: Verify actual installed 2.7.0 upgrade and recovery
        timeout-minutes: 8
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./desktop/installer-acceptance.ps1
      - name: Verify source archive and update integrity
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          python make_bundle.py
          if ($LASTEXITCODE -ne 0) { throw 'Source archive verification failed' }
          node desktop/verify-release.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Update manifest integrity check failed' }
          if ((Get-Item "release/$version/Tv-Tracker-$version-x64.exe").VersionInfo.ProductVersion -ne $version) { throw 'Installer product version does not match the release' }
      - name: Retain validated Windows build
        uses: actions/upload-artifact@v4
        with:
          name: tv-tracker-windows-${{ github.sha }}
          path: |
            release/${{ steps.build_version.outputs.number }}/Tv-Tracker-*
            release/${{ steps.build_version.outputs.number }}/latest.yml
          retention-days: 14

  publish:
    needs: build
    # Publication follows all build gates, including actual NSIS upgrade/recovery.
    if: github.ref == 'refs/heads/tv-tracker' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release))
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tv-tracker-windows-${{ github.sha }}
          path: release/${{ needs.build.outputs.version }}
      - name: Decide whether this version needs publishing
        id: version
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Use a stable major.minor.patch desktop version.' }
          "number=$version" >> $env:GITHUB_OUTPUT
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v$version" 2>release-lookup.err
          if ($LASTEXITCODE -eq 0) {
            if (($release | ConvertFrom-Json).draft) { throw 'An unfinished draft exists. Inspect it before retrying this version.' }
            "publish=false" >> $env:GITHUB_OUTPUT
          } elseif ((Get-Content release-lookup.err -Raw) -match 'HTTP 404') {
            "publish=true" >> $env:GITHUB_OUTPUT
          } else { throw 'Could not query GitHub releases. No release will be created.' }
          exit 0
      - name: Stage and publish complete release
        if: github.event_name != 'pull_request' && steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $folder = "release/$version"
          $assets = @("$folder/Tv-Tracker-$version-x64.exe", "$folder/Tv-Tracker-$version-x64.exe.blockmap", "$folder/latest.yml", "$folder/Tv-Tracker-$version-x64.zip", "$folder/Tv-Tracker-$version-source.zip")
          $installer = "$folder/Tv-Tracker-$version-x64.exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          $signingNote = node desktop/distribution-policy.cjs "$($signature.Status)" "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'Installer distribution policy failed' }
          foreach ($asset in $assets) { if (!(Test-Path -LiteralPath $asset)) { throw "Missing release asset: $asset" } }
          $hashes = foreach ($asset in $assets) { "$( (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant() )  $(Split-Path -Leaf $asset)" }
          $hashes | Set-Content -Encoding utf8NoBOM "$folder/SHA256SUMS.txt"
          $assets += "$folder/SHA256SUMS.txt"
          @("Tv Tracker $version", '', 'Install the Windows .exe once if upgrading from 2.1.0 or earlier.', 'Afterward use Connections & settings > Updates.', 'Local captures and encrypted connections are retained.', '', 'For shared workbooks: stop old capture/sync jobs and update every PC before publishing. Updated PCs take turns automatically. Interrupted publishing slots can be reviewed in Storage and recovery.', 'Excel imports now support explicit duplicate-order review. SLA timing review explains missing or invalid evidence.', '', $signingNote, 'Installer SHA-512 is verified against latest.yml during build and update download.', '', "Source commit: $env:GITHUB_SHA") | Set-Content release-notes.txt
          gh release create "v$version" --target "$env:GITHUB_SHA" --title "Tv Tracker $version" --draft --notes-file release-notes.txt
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed' }
          gh release upload "v$version" @assets
          if ($LASTEXITCODE -ne 0) { throw 'Upload failed; draft left unpublished for inspection' }
          # Verify the hosted bytes, not merely a successful upload response.
          $download = Join-Path $env:RUNNER_TEMP "tv-tracker-release-$version-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $download -ErrorAction Stop | Out-Null
          gh release download "v$version" --dir "$download"
          if ($LASTEXITCODE -ne 0) { throw 'Draft download verification failed; release remains unpublished' }
          foreach ($asset in $assets) {
            $remote = Join-Path $download (Split-Path -Leaf $asset)
            if (!(Test-Path -LiteralPath $remote) -or (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath $remote -Algorithm SHA256).Hash) {
              throw 'Hosted release asset differs from the validated build; release remains unpublished'
            }
          }
          gh release edit "v$version" --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
