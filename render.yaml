services:
  - type: web
    name: datatrace-workspace
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATATRACE_HEADLESS
        value: "true"
      - key: DATATRACE_USERNAME
        sync: false
      - key: DATATRACE_PASSWORD
        sync: false
      - key: DATATRACE_QUEUE_URL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
    # Free services cannot attach a persistent disk. Synced history is recovered
    # from Google Sheets. Keep a persistent local backend, or explicitly choose
    # a paid service with a disk, to preserve unsynced previews across restarts.
